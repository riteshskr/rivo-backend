name: Keep Render Alive

on:
  schedule:
    # हर 10 मिनट में एक बार (GitHub की देरी को देखते हुए 15 मिनट से कम रहेगा)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          echo "Pinging https://rivo-api-ezoo.onrender.com/health ..."
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://rivo-api-ezoo.onrender.com/health)
          echo "HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "❌ Ping failed with status $code"
            exit 1
          fi
          echo "✅ Render is awake"